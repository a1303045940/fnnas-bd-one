name: Repack FnNAS for RK3568 Board

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Official FnNAS Image Download URL"
        required: true
        default: "https://download.liveupdate.fnnas.com/arm/image/1.2.0302/mrkaio-m68s/fnos_Mainland-PE_arm_1.2.0302_mrkaio-m68s_2288.img.gz?sign=496b9c10436d6759d1e1273bd4a2653d&t=1789477906"
      target_board:
        description: "Target Board Identifier"
        required: true
        default: "bdkj-bd-one"
      version_tag:
        description: "Release Tag"
        required: true
        default: "v1.2.0302-bd-one"

permissions:
  contents: write

jobs:
  repack-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pigz gzip coreutils util-linux

      - name: Download & Extract Base Image
        run: |
          echo "Downloading official image..."
          curl -fSL "${{ inputs.image_url }}" -o base_image.img.gz
          echo "Decompressing gz image..."
          pigz -d base_image.img.gz
          ls -lh base_image.img

      - name: Inject Custom Bootloader and DTB
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="base_image.img"
          MOUNT_DIR="/mnt/fnnas-part"
          SRC_IDB="my-boot/idbloader-rk3568-bd-one.img"
          SRC_UBOOT="my-boot/u-boot-rk3568-bd-one.itb"
          SRC_DTB="my-boot/rk3568-bd-one.dtb"
          TARGET_DTB_NAME="rk3568-bd-one.dtb"

          for f in "${IMAGE}" "${SRC_IDB}" "${SRC_UBOOT}" "${SRC_DTB}"; do
            [[ -s "${f}" ]] || {
              echo "错误：文件不存在或大小为 0：${f}"
              exit 1
            }
          done

          DEV=""
          MOUNTED=""

          cleanup() {
            status=$?
            set +e

            if [[ -n "${MOUNTED}" ]] && mountpoint -q "${MOUNT_DIR}"; then
              sudo umount "${MOUNT_DIR}"
            fi

            if [[ -n "${DEV}" ]]; then
              sudo losetup -d "${DEV}"
            fi

            exit "${status}"
          }

          trap cleanup EXIT INT TERM

          sudo mkdir -p "${MOUNT_DIR}"

          echo "===== Source file hashes ====="
          sha256sum "${SRC_IDB}" "${SRC_UBOOT}" "${SRC_DTB}"

          echo "===== Attach image as loop device ====="
          DEV="$(sudo losetup --find --show --partscan "${IMAGE}")"
          echo "Loop device: ${DEV}"

          sudo partprobe "${DEV}" || true
          sudo udevadm settle || true
          lsblk -o NAME,SIZE,FSTYPE,LABEL,PARTLABEL,MOUNTPOINTS "${DEV}"

          echo "===== Write RK3568 bootloader ====="
          sudo dd if="${SRC_IDB}" of="${DEV}" bs=512 seek=64 conv=notrunc,fsync status=progress
          sudo dd if="${SRC_UBOOT}" of="${DEV}" bs=512 seek=16384 conv=notrunc,fsync status=progress

          echo "===== Verify raw bootloader writes ====="
          IDB_SIZE="$(stat -c '%s' "${SRC_IDB}")"
          UBOOT_SIZE="$(stat -c '%s' "${SRC_UBOOT}")"

          sudo dd if="${DEV}" bs=512 skip=64 count=$(( (IDB_SIZE + 511) / 512 )) status=none | \
            head -c "${IDB_SIZE}" | sha256sum

          sha256sum "${SRC_IDB}"

          sudo dd if="${DEV}" bs=512 skip=16384 count=$(( (UBOOT_SIZE + 511) / 512 )) status=none | \
            head -c "${UBOOT_SIZE}" | sha256sum

          sha256sum "${SRC_UBOOT}"

          BOOT_CONFIG_FOUND=false
          DTB_INJECTED=false

          for PART in "${DEV}"p*; do
            [[ -b "${PART}" ]] || continue

            FSTYPE="$(lsblk -no FSTYPE "${PART}" | head -n 1)"
            [[ -n "${FSTYPE}" ]] || continue

            echo "===== Check partition: ${PART}, fs=${FSTYPE} ====="

            if ! sudo mount -o rw "${PART}" "${MOUNT_DIR}"; then
              echo "Skip: cannot mount ${PART}"
              continue
            fi
            MOUNTED="${PART}"

            TARGET_DTB_DIR="$(sudo find "${MOUNT_DIR}" \
              -type d \
              -path '*/dtb/rockchip' \
              -print -quit 2>/dev/null || true)"

            if [[ -n "${TARGET_DTB_DIR}" ]]; then
              echo "DTB directory: ${TARGET_DTB_DIR}"

              sudo install -Dm0644 \
                "${SRC_DTB}" \
                "${TARGET_DTB_DIR}/${TARGET_DTB_NAME}"

              echo "===== Verify injected DTB ====="
              sha256sum "${SRC_DTB}"
              sudo sha256sum "${TARGET_DTB_DIR}/${TARGET_DTB_NAME}"
              sudo cmp -s "${SRC_DTB}" "${TARGET_DTB_DIR}/${TARGET_DTB_NAME}"

              DTB_INJECTED=true
            fi

            EXTLINUX_CONF="$(sudo find "${MOUNT_DIR}" \
              -type f \
              -path '*/extlinux/extlinux.conf' \
              -print -quit 2>/dev/null || true)"

            FNENV_CONF="$(sudo find "${MOUNT_DIR}" \
              -type f \
              -name 'fnEnv.txt' \
              -print -quit 2>/dev/null || true)"

            ARMBIANENV_CONF="$(sudo find "${MOUNT_DIR}" \
              -type f \
              -name 'armbianEnv.txt' \
              -print -quit 2>/dev/null || true)"

            if [[ -n "${EXTLINUX_CONF}" ]]; then
              echo "===== Found extlinux.conf: ${EXTLINUX_CONF} ====="
              sudo cat "${EXTLINUX_CONF}"

              if sudo grep -qE '^[[:space:]]*FDT[[:space:]]+' "${EXTLINUX_CONF}"; then
                sudo sed -i -E \
                  's|^[[:space:]]*FDT[[:space:]]+.*|  FDT /dtb/rockchip/rk3568-bd-one.dtb|' \
                  "${EXTLINUX_CONF}"
              else
                sudo sed -i '/^[[:space:]]*LINUX[[:space:]]/a\  FDT /dtb/rockchip/rk3568-bd-one.dtb' \
                  "${EXTLINUX_CONF}"
              fi

              echo "===== Updated extlinux.conf ====="
              sudo cat "${EXTLINUX_CONF}"
              BOOT_CONFIG_FOUND=true

            elif [[ -n "${FNENV_CONF}" ]]; then
              echo "===== Found fnEnv.txt: ${FNENV_CONF} ====="

              if sudo grep -qE '^fdtfile=' "${FNENV_CONF}"; then
                sudo sed -i -E \
                  's|^fdtfile=.*|fdtfile=rockchip/rk3568-bd-one.dtb|' \
                  "${FNENV_CONF}"
              else
                echo 'fdtfile=rockchip/rk3568-bd-one.dtb' | sudo tee -a "${FNENV_CONF}" >/dev/null
              fi

              sudo cat "${FNENV_CONF}"
              BOOT_CONFIG_FOUND=true

            elif [[ -n "${ARMBIANENV_CONF}" ]]; then
              echo "===== Found armbianEnv.txt: ${ARMBIANENV_CONF} ====="

              if sudo grep -qE '^fdtfile=' "${ARMBIANENV_CONF}"; then
                sudo sed -i -E \
                  's|^fdtfile=.*|fdtfile=rockchip/rk3568-bd-one.dtb|' \
                  "${ARMBIANENV_CONF}"
              else
                echo 'fdtfile=rockchip/rk3568-bd-one.dtb' | sudo tee -a "${ARMBIANENV_CONF}" >/dev/null
              fi

              sudo cat "${ARMBIANENV_CONF}"
              BOOT_CONFIG_FOUND=true
            fi

            sudo sync
            sudo umount "${MOUNT_DIR}"
            MOUNTED=""
          done

          [[ "${DTB_INJECTED}" == "true" ]] || {
            echo "错误：未在任何可挂载分区中找到 dtb/rockchip 目录。"
            exit 1
          }

          [[ "${BOOT_CONFIG_FOUND}" == "true" ]] || {
            echo "错误：未找到 extlinux.conf、fnEnv.txt 或 armbianEnv.txt。"
            exit 1
          }

          echo "自定义 RK3568 bootloader、DTB 和启动配置均已完成注入。"
          
      - name: Compress Patched Image
        run: |
          TARGET_NAME="fnos_1.2.0302_${{ inputs.target_board }}_rk3568.img"
          mv base_image.img "${TARGET_NAME}"
          echo "Compressing with pigz..."
          pigz -9 "${TARGET_NAME}"
          ls -lh *.img.gz

      - name: Upload packaged FnNAS to Release
        uses: ophub/upload-to-releases@main
        if: ${{ !cancelled() }}
        with:
          tag: ${{ inputs.version_tag }}
          artifacts: "*.img.gz"
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            - 基于 FnOS 官方 1.2.0302 镜像重打包
            - 适配设备目标板卡: ${{ inputs.target_board }}
            - 注入引导: U-Boot + idbloader + 设备专用 DTB
